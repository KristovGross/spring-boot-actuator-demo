# ============================================================
# CONFIGURACION GENERAL DE LA APLICACION
# ============================================================
# Spring Security
#
# Las credenciales pueden proporcionarse mediante variables de entorno y no deben almacenarse directamente en Git
spring.security.user.name=${ACTUATOR_USERNAME:actuator}
spring.security.user.password=${ACTUATOR_PASSWORD:${random.uuid}}
spring.security.user.roles=ACTUATOR_ADMIN

# ============================================================
# INFO ENDPOINT
# ============================================================
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@

# ============================================================
# ACTUATOR
# ============================================================
# El endpoint de shutdown permanece deshabilitado por defecto
management.endpoint.shutdown.enabled=${MANAGEMENT_ENDPOINT_SHUTDOWN_ENABLED:false}

# La cantidad de informacion mostrada por health depende del ambiente
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}

# Principio de minima exposicion
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
