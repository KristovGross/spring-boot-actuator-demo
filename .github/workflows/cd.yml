name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente objetivo"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod

      deploy:
        description: "Ejecutar deployment real en AWS"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cd-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  PROJECT_NAME: liverpool-actuator

jobs:

  # ==========================================================
  # BUILD
  # ==========================================================
  build:
    name: Build container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CI-CD/deploy/docker/Dockerfile
          push: false
          load: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.PROJECT_NAME }}:${{ github.sha }}

      - name: Show image
        run: docker image inspect "${PROJECT_NAME}:${GITHUB_SHA}"

  # ==========================================================
  # TERRAFORM VALIDATION
  #
  # No crea infraestructura. (para evitar costos a mi cuenta de AWS)
  # ==========================================================

  terraform-validation:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init without backend
        working-directory: CI-CD/deploy/terraform/environments/${{ inputs.environment }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: CI-CD/deploy/terraform/environments/${{ inputs.environment }}
        run: terraform validate


  # ==========================================================
  # DEPLOYMENT PREVIEW
  # ==========================================================
  deployment-preview:
    name: Deployment preview
    runs-on: ubuntu-latest
    needs:
      - build
      - terraform-validation

    steps:
      - name: Deployment information
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Git SHA: ${{ github.sha }}"
          echo "Docker image tag: ${{ github.sha }}"
          echo "Deploy requested: ${{ inputs.deploy }}"

      - name: Dry-run notice
        if: ${{ !inputs.deploy }}
        run: |
          echo "Dry-run mode."
          echo "No AWS resources will be created or modified."

  # ==========================================================
  # REAL AWS DEPLOYMENT
  #
  # Solo puede ejecutarse:
  # - manualmente
  # - deploy=true
  # - desde main
  # ==========================================================
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    needs:
      - build
      - terraform-validation
      - deployment-preview

    if: |
      inputs.deploy == true &&
      github.ref == 'refs/heads/main'

    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define deployment variables
        shell: bash
        run: |
          echo "ECR_REPOSITORY=${PROJECT_NAME}-${{ inputs.environment }}" >> "$GITHUB_ENV"
          echo "ECS_CLUSTER=${PROJECT_NAME}-${{ inputs.environment }}-cluster" >> "$GITHUB_ENV"
          echo "ECS_SERVICE=${PROJECT_NAME}-${{ inputs.environment }}-service" >> "$GITHUB_ENV"

      - name: Build and push immutable image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --file CI-CD/deploy/docker/Dockerfile \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" \
            --push \
            .

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"