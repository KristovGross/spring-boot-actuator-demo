name: CD - Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente objetivo"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod

      deploy:
        description: "Ejecutar deployment real en AWS"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cd-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  PROJECT_NAME: liverpool-actuator
  CONTAINER_NAME: actuator-demo

jobs:

  # ==========================================================
  # BUILD  
  # Se ejecuta siempre, incluso en dry-run
  # No publica ninguna imagen en AWS
  # ==========================================================

  build:
    name: Build container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: CI-CD/deploy/docker/Dockerfile
          push: false
          load: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.PROJECT_NAME }}:${{ github.sha }}

      - name: Verify Docker image
        run: |
          docker image inspect "${PROJECT_NAME}:${GITHUB_SHA}"


  # ==========================================================
  # TERRAFORM VALIDATION
  # Valida el ambiente seleccionado
  # No crea infraestructura (para evitar costos en mi cuenta AWS)
  # ==========================================================

  terraform-validation:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init without backend
        working-directory: CI-CD/deploy/terraform/environments/${{ inputs.environment }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: CI-CD/deploy/terraform/environments/${{ inputs.environment }}
        run: terraform validate


  # ==========================================================
  # DEPLOYMENT PREVIEW
  # Muestra los datos que se utilizarian durante el deployment
  # deploy=false no utiliza AWS
  # ==========================================================

  deployment-preview:
    name: Deployment preview
    runs-on: ubuntu-latest

    needs:
      - build
      - terraform-validation

    steps:
      - name: Show deployment information
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Git SHA: ${{ github.sha }}"
          echo "Image tag: ${{ github.sha }}"
          echo "Deploy requested: ${{ inputs.deploy }}"

      - name: Dry-run notice
        if: ${{ !inputs.deploy }}
        run: |
          echo "Dry-run mode enabled."
          echo "No AWS authentication will be performed."
          echo "No AWS resources will be created or modified."


  # ==========================================================
  # AWS DEPLOYMENT
  # Se ejecuta solamente cuando:  
  # 1. El workflow fue iniciado manualmente
  # 2. deploy=true
  # 3. La ejecucion proviene de master
  # ==========================================================

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    needs:
      - build
      - terraform-validation
      - deployment-preview

    if: ${{ inputs.deploy == true && github.ref == 'refs/heads/master' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ------------------------------------------------------
      # OIDC
      # Obtiene credenciales temporales
      # No utiliza AWS_ACCESS_KEY_ID ni AWS_SECRET_ACCESS_KEY
      # ------------------------------------------------------

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------
      # VARIABLES
      # ------------------------------------------------------

      - name: Define deployment variables
        shell: bash
        run: |
          echo "ECR_REPOSITORY=${PROJECT_NAME}-${{ inputs.environment }}" >> "$GITHUB_ENV"
          echo "ECS_CLUSTER=${PROJECT_NAME}-${{ inputs.environment }}-cluster" >> "$GITHUB_ENV"
          echo "ECS_SERVICE=${PROJECT_NAME}-${{ inputs.environment }}-service" >> "$GITHUB_ENV"
          echo "TASK_FAMILY=${PROJECT_NAME}-${{ inputs.environment }}" >> "$GITHUB_ENV"

      # ------------------------------------------------------
      # ECR LOGIN
      # ------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------
      # BUILD + PUSH
      # Cada imagen utiliza github.sha como tag inmutable
      # ------------------------------------------------------

      - name: Build and push immutable Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        shell: bash
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --file CI-CD/deploy/docker/Dockerfile \
            --tag "$IMAGE_URI" \
            --push \
            .

      # ------------------------------------------------------
      # DOWNLOAD CURRENT TASK DEFINITION
      # Obtiene la revision actualmente utilizada como base
      # ------------------------------------------------------

      - name: Download current ECS task definition
        shell: bash
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition \
            --region "$AWS_REGION" \
            > task-definition.json

      # ------------------------------------------------------
      # RENDER NEW TASK DEFINITION
      # Sustituye solamente la imagen del container
      # ------------------------------------------------------

      - name: Render ECS task definition with new image
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      # ------------------------------------------------------
      # ECS DEPLOYMENT
      # Registra una nueva revision de la Task Definition y
      # actualiza el ECS Service
      # ------------------------------------------------------

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ------------------------------------------------------
      # POST-DEPLOYMENT VERIFICATION
      # ------------------------------------------------------

      - name: Verify ECS service
        shell: bash
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].{Status:status,Desired:desiredCount,Running:runningCount,TaskDefinition:taskDefinition}"